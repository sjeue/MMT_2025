<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Control Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-view" class="dashboard">
        <h1>Kết nối máy chủ</h1>
        <div class="connection-settings">
            <div class="input-group">
                <label for="server-ip">Server IP:</label>
                <input type="text" id="server-ip" value="127.0.0.1" placeholder="Nhập IP Server">
            </div>
            <div class="input-group">
                <label for="server-port">Port:</label>
                <input type="number" id="server-port" value="9001" placeholder="Nhập Port">
            </div>
            <button id="btn-connect">Kết nối</button>
        </div>
        <div class="status-box">
            Trạng thái:&nbsp;<span id="login-status-light" class="disconnected"></span>
            <span id="login-status-text">Chưa kết nối</span>
        </div>
    </div>

    <div id="control-view" class="dashboard hidden wide-dashboard">
        <h1>Bảng điều khiển</h1>
        <div class="status-box">
            Trạng thái:&nbsp;<span id="control-status-light" class="connected"></span>
            <span id="control-status-text">Đã kết nối</span>
        </div>

        <div class="control-layout">
            
            <div class="col-left">
                <fieldset class="control-group">
                    <legend>Quản lý Apps (Cửa sổ)</legend>
                    <button id="btn-list-apps">Danh sách Apps đang chạy</button>
                    <div class="input-with-button">
                        <input type="text" id="app-name-start" placeholder="Tên App (vd: notepad)">
                        <button id="btn-start-app">Mở App</button>
                    </div>
                    <div class="input-with-button">
                        <input type="text" id="app-pid-stop" placeholder="PID hoặc Tên App">
                        <button id="btn-stop-app" class="btn-warning">Đóng App</button>
                    </div>
                </fieldset>

                <fieldset class="control-group">
                    <legend>Quản lý Processes (Nền)</legend>
                    <button id="btn-list-process">Danh sách Processes</button>
                    <div class="input-with-button">
                        <input type="text" id="process-name-start" placeholder="Tên process (vd: calc.exe)">
                        <button id="btn-start-process">Chạy Process</button>
                    </div>
                    <div class="input-with-button">
                        <input type="text" id="process-pid-stop" placeholder="PID hoặc Tên process">
                        <button id="btn-stop-process" class="btn-warning">Diệt Process</button>
                    </div>
                </fieldset>
            </div>

            <div class="col-right">
                <fieldset class="control-group">
                    <legend>Tác vụ Màn hình</legend>
                    <button id="btn-screen-capture">Chụp màn hình (Screenshot)</button>
                    <div class="input-with-button">
                        <input type="number" id="record-duration" value="10" min="1" placeholder="Giây">
                        <button id="btn-screen-record">Quay Video (Giây)</button>
                    </div>
                </fieldset>
                
                <fieldset class="control-group">
                    <legend>Gửi tin nhắn</legend>
                    <div class="input-with-button">
                        <input type="text" id="message-text" placeholder="Nội dung tin nhắn...">
                        <button id="btn-send-message">Gửi</button>
                    </div>
                </fieldset>
                
                <fieldset class="control-group">
                    <legend>Hệ thống</legend>
                    <button id="btn-shutdown" class="btn-danger">TẮT MÁY CHỦ (SHUTDOWN)</button>
                </fieldset>
            </div>
        </div>

        <hr>
        <button id="btn-disconnect" class="btn-neutral">Ngắt kết nối</button>
    </div>

    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title">Kết quả</h2>
            
            <div id="modal-body"></div>
            
            <div id="modal-footer" class="hidden">
                <a id="download-link" href="#" download class="btn-download">Tải xuống</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
