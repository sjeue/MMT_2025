<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-view" class="dashboard">
        <h1>Kết nối máy chủ</h1>
        <div class="connection-settings">
            <div class="input-group">
                <label for="server-ip">Server IP:</label>
                <input type="text" id="server-ip" value="127.0.0.1">
            </div>
            <div class="input-group">
                <label for="server-port">Port:</label>
                <input type="number" id="server-port" value="9001">
            </div>
            <button id="btn-connect">Kết nối</button>
        </div>
        <div class="status-box">
            Trạng thái:&nbsp;<span id="login-status-light" class="disconnected"></span>
            <span id="login-status-text">Chưa kết nối</span>
        </div>
    </div>

    <div id="control-view" class="dashboard hidden">
        <h1>Bảng điều khiển</h1>
        <div class="status-box">
            Trạng thái:&nbsp;<span id="control-status-light" class="connected"></span>
            <span id="control-status-text">Đã kết nối</span>
        </div>

        <fieldset class="control-group">
            <legend>Quản lý Process</legend>
            <button id="btn-list-process">List Running Processes</button>
            <div class="input-with-button">
                <input type="text" id="process-name-start" placeholder="Tên process (vd: notepad.exe)">
                <button id="btn-start-process">Start</button>
            </div>
            <div class="input-with-button">
                <input type="text" id="process-pid-stop" placeholder="PID hoặc Tên process">
                <button id="btn-stop-process">Stop</button>
            </div>
        </fieldset>

        <fieldset class="control-group">
            <legend>Tác vụ Màn hình</legend>
            <button id="btn-screen-capture">Chụp màn hình</button>
            <div class="input-with-button">
                <input type="number" id="record-duration" value="10" min="1">
                <button id="btn-screen-record">Quay video</button>
            </div>
        </fieldset>
        
        <fieldset class="control-group">
            <legend>Gửi tin nhắn</legend>
            <div class="input-with-button">
                <input type="text" id="message-text" placeholder="Nội dung tin nhắn...">
                <button id="btn-send-message">Gửi</button>
            </div>
        </fieldset>
        
        <fieldset class="control-group">
            <legend>Hệ thống</legend>
            <button id="btn-shutdown" class="btn-danger">SHUTDOWN Server</button>
        </fieldset>

        <hr>
        <button id="btn-disconnect" class="btn-neutral">Ngắt kết nối</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
