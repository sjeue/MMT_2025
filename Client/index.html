<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | AI Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-animation"></div>

    <div id="login-view" class="dashboard glass-panel">
        <div class="logo-area">
            <i class="fa-solid fa-satellite-dish fa-3x pulse-icon"></i>
            <h1>SYSTEM CONTROL</h1>
            <p class="subtitle">Secure Remote Administration</p>
        </div>
        
        <div class="connection-settings">
            <div class="input-group">
                <label><i class="fa-solid fa-server"></i> Server IP</label>
                <input type="text" id="server-ip" value="127.0.0.1" placeholder="Ex: 192.168.1.10">
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-network-wired"></i> Port</label>
                <input type="number" id="server-port" value="9001" placeholder="Ex: 9001">
            </div>
            <button id="btn-connect" class="btn-glow">
                <i class="fa-solid fa-bolt"></i> KẾT NỐI
            </button>
        </div>
        
        <div class="status-footer">
            <span id="login-status-light" class="status-dot disconnected"></span>
            <span id="login-status-text">Ready to connect...</span>
        </div>
    </div>

    <div id="control-view" class="dashboard glass-panel wide-dashboard hidden">
        <header class="control-header">
            <div class="header-left">
                <h2><i class="fa-solid fa-terminal"></i> COMMAND CENTER</h2>
                <div class="status-badge">
                    <span id="control-status-light" class="status-dot connected"></span>
                    <span id="control-status-text">ONLINE</span>
                </div>
            </div>
            <button id="btn-disconnect" class="btn-ghost"><i class="fa-solid fa-power-off"></i> Ngắt kết nối</button>
        </header>

        <div class="control-layout">
            
            <div class="col-left">
                <div class="card">
                    <div class="card-header"><i class="fa-brands fa-windows"></i> Quản lý Ứng dụng</div>
                    <div class="card-body">
                        <button id="btn-list-apps" class="btn-primary"><i class="fa-solid fa-list"></i> Xem danh sách Apps</button>
                        <div class="action-row">
                            <input type="text" id="app-name-start" placeholder="Tên App (vd: notepad)">
                            <button id="btn-start-app" class="btn-success"><i class="fa-solid fa-play"></i> Mở</button>
                        </div>
                        <div class="action-row">
                            <input type="text" id="app-pid-stop" placeholder="PID hoặc Tên">
                            <button id="btn-stop-app" class="btn-danger"><i class="fa-solid fa-xmark"></i> Đóng</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-microchip"></i> Quản lý Tiến trình (Process)</div>
                    <div class="card-body">
                        <button id="btn-list-process" class="btn-primary"><i class="fa-solid fa-list-ol"></i> Xem danh sách Process</button>
                        <div class="action-row">
                            <input type="text" id="process-name-start" placeholder="Tên process (vd: calc.exe)">
                            <button id="btn-start-process" class="btn-success"><i class="fa-solid fa-play"></i> Chạy</button>
                        </div>
                        <div class="action-row">
                            <input type="text" id="process-pid-stop" placeholder="PID hoặc Tên">
                            <button id="btn-stop-process" class="btn-danger"><i class="fa-solid fa-skull"></i> Diệt</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-right">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-eye"></i> Giám sát Hình ảnh</div>
                    <div class="card-body grid-2">
                        <button id="btn-screen-capture" class="btn-info big-btn">
                            <i class="fa-solid fa-desktop fa-2x"></i><br>Chụp Màn hình
                        </button>
                        <button id="btn-webcam-capture" class="btn-info big-btn">
                            <i class="fa-solid fa-camera fa-2x"></i><br>Chụp Webcam
                        </button>
                    </div>
                    <div class="card-body" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top:10px;">
                        <div class="action-row">
                            <input type="number" id="webcam-duration" value="5" min="1" placeholder="Giây" style="width: 60px;">
                            <button id="btn-webcam-record" class="btn-warning"><i class="fa-solid fa-video"></i> Quay Video Webcam</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-keyboard"></i> Keylogger</div>
                    <div class="card-body grid-2">
                        <button id="btn-keylogger-start" class="btn-warning"><i class="fa-solid fa-record-vinyl"></i> Bắt đầu ghi</button>
                        <button id="btn-keylogger-stop" class="btn-neutral"><i class="fa-solid fa-file-text"></i> Dừng & Lấy Log</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-gears"></i> Hệ thống</div>
                    <div class="card-body">
                        <div class="action-row">
                            <input type="text" id="message-text" placeholder="Gửi thông báo...">
                            <button id="btn-send-message" class="btn-primary"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
                        </div>
                        <button id="btn-shutdown" class="btn-danger full-width" style="margin-top: 10px;">
                            <i class="fa-solid fa-power-off"></i> TẮT MÁY CHỦ TỪ XA
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title">Kết quả</h2>
            <div id="modal-body" class="custom-scroll"></div>
            <div id="modal-footer" class="hidden">
                <a id="download-link" href="#" download class="btn-download"><i class="fa-solid fa-download"></i> Tải xuống</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
