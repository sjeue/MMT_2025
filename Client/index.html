<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <h1>Bảng giám sát máy chủ</h1>

        <div class="status-box">
            Trạng thái: <span id="status-light" class="disconnected"></span>
            <span id="status-text">Đang kết nối...</span>
        </div>

        <div class="card-container">
            <div class="card">
                <h2>CPU</h2>
                <div class="data-display" id="cpu-display">-- %</div>
            </div>

            <div class="card">
                <h2>RAM</h2>
                <div class="data-display" id="ram-display">-- MB</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
